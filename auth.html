<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ボランティア認証</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f6; }
        .auth-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #3788d8; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .toggle-btn { text-align: center; margin-top: 20px; font-size: 0.9em; color: #3788d8; cursor: pointer; border: none; background: none; width: 100%; text-decoration: underline; }
        .error-msg { margin-top: 15px; color: #e74c3c; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="title">ログイン</h2>
    
    <div id="nickname-area" style="display: none;">
        <input type="text" id="nickname" placeholder="ニックネーム（例：田中）">
    </div>
    <input type="email" id="email" placeholder="メールアドレス">
    
    <button id="main-btn">カレンダーを開く</button>
    <div id="msg" class="error-msg"></div>
    
    <button id="toggle-btn" class="toggle-btn">新規登録はこちら</button>
</div>

<script>
    const S_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";

    let supabaseClient;
    try {
        supabaseClient = supabase.createClient(S_URL, S_KEY);
    } catch (e) {
        document.getElementById('msg').innerText = "設定エラー：URLかキーが正しくありません。";
    }

    let isSignUp = false;

    document.getElementById('toggle-btn').addEventListener('click', () => {
        isSignUp = !isSignUp;
        document.getElementById('nickname-area').style.display = isSignUp ? 'block' : 'none';
        document.getElementById('title').innerText = isSignUp ? '新規登録' : 'ログイン';
        document.getElementById('main-btn').innerText = isSignUp ? '登録して確認メールを送信' : 'カレンダーを開く';
        document.getElementById('toggle-btn').innerText = isSignUp ? 'ログインに戻る' : '新規登録はこちら';
    });

    document.getElementById('main-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const nickname = document.getElementById('nickname').value;
        const msg = document.getElementById('msg');
        const urlParams = new URLSearchParams(window.location.search);
        const vid = urlParams.get('vid') || "IDなし"; 

        msg.innerText = "処理中...";
        msg.style.color = "#333";

        if (!email) { msg.innerText = "メールアドレスを入力してください"; msg.style.color = "red"; return; }

        if (isSignUp) {
            if (!nickname) { msg.innerText = "ニックネームを入力してください"; msg.style.color = "red"; return; }
            const { error } = await supabaseClient.auth.signUp({
                email: email, 
                password: "password123", 
                options: { data: { nickname: nickname, volunteer_id: vid } }
            });
            if (error) { msg.innerText = error.message; msg.style.color = "red"; }
            else { msg.style.color = "green"; msg.innerText = "承認メールを送りました。リンクをクリックしてください。"; }
        } else {
            // ログイン（SignIn）の処理
            const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                email: email, 
                password: "password123" 
            });

            if (error) { 
                msg.innerText = "登録がないか、承認が終わっていません。: " + error.message; 
                msg.style.color = "red"; 
            } else { 
                // ★ 修正ポイント：メッセージを出して少し待機する ★
                msg.innerText = "ログイン成功！移動します...";
                msg.style.color = "green";
                
                // ブラウザが「ログインした」という情報を保存し終えるのを待つために
                // 0.8秒（800ミリ秒）後にページを移動させます。
                setTimeout(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const vid = urlParams.get('vid') || "IDなし"; 
                    window.location.href = `calendar_volunteer.html?vid=${encodeURIComponent(vid)}`; 
                }, 800); 
            }
        }
    });
</script>
</body>
</html>
