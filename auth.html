<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ボランティア認証</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f6; }
        .auth-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #3788d8; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .toggle-btn { text-align: center; margin-top: 20px; font-size: 0.9em; color: #3788d8; cursor: pointer; border: none; background: none; width: 100%; text-decoration: underline; }
        .error-msg { margin-top: 15px; color: #e53e3e; font-size: 0.9em; text-align: center; min-height: 1.5em; line-height: 1.4; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="auth-title" style="text-align:center;">ログイン</h2>
    <input type="email" id="email" placeholder="メールアドレス example@email.com">
    <input type="text" id="nickname" placeholder="名前 ニックネーム" style="display:none;">
    
    <button id="main-btn" onclick="handleAuth()">カレンダーを開く</button>
    <button id="toggle-btn" class="toggle-btn" onclick="toggleMode()">新規登録はこちら</button>
    <div id="msg" class="error-msg"></div>
</div>

<script>
    const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
    const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, API_KEY);

    let isSignUp = false;
    const urlParams = new URLSearchParams(window.location.search);
    let vid = urlParams.get('vid');

    // --- 追加：メールリンクから戻ってきた際の自動ログイン処理 ---
    document.addEventListener('DOMContentLoaded', async function() {
        // セッション（ログイン状態）があるか確認
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (session) {
            const userVid = session.user.user_metadata.volunteer_id;
            const msg = document.getElementById('msg');
            
            // 入力フォームとボタンを隠してメッセージを表示
            document.getElementById('email').style.display = 'none';
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('toggle-btn').style.display = 'none';
            document.getElementById('auth-title').innerText = "認証成功";

            msg.style.color = "green";
            msg.innerText = "認証されました。カレンダーへ移動します...";
            
            setTimeout(() => {
                window.location.href = `calendar_volunteer.html?vid=${encodeURIComponent(userVid)}`;
            }, 1000);
        }
    });

    function toggleMode() {
        isSignUp = !isSignUp;
        document.getElementById('nickname').style.display = isSignUp ? 'block' : 'none';
        document.getElementById('auth-title').innerText = isSignUp ? '新規登録' : 'ログイン';
        document.getElementById('main-btn').innerText = isSignUp ? '登録して確認メールを送信' : 'カレンダーを開く';
        document.getElementById('toggle-btn').innerText = isSignUp ? 'ログインに戻る' : '新規登録はこちら';
        document.getElementById('msg').innerText = "";
    }

    async function handleAuth() {
        const email = document.getElementById('email').value.trim();
        const nickname = document.getElementById('nickname').value.trim();
        const msg = document.getElementById('msg');
        msg.style.color = "#e53e3e";
        msg.innerText = "処理中...";

        if (!email) { msg.innerText = "メールアドレスを入力してください"; return; }

        try {
            if (isSignUp) {
                if (!nickname) { msg.innerText = "ニックネームを入力してください"; return; }
                const newVid = vid || "V" + Math.floor(1000 + Math.random() * 9000);

                const { data, error } = await supabaseClient.auth.signUp({
                    email: email, 
                    password: "password123",
                    options: { data: { nickname: nickname, volunteer_id: newVid } }
                });

                const alreadyExists = (data?.user && data?.user?.identities?.length === 0) || 
                                     (error && error.message.includes("already registered"));

                if (alreadyExists) {
                    msg.style.color = "#dd6b20";
                    msg.innerText = "⚠️ このアドレスは既に登録されています。\n別のアドレスを入力してください。";
                } else if (error) {
                    throw error;
                } else { 
                    // 登録成功時にボタンとリンクの両方を隠す
                    document.getElementById('main-btn').style.display = 'none';
                    document.getElementById('toggle-btn').style.display = 'none'; 
                    
                    msg.style.color = "green"; 
                    msg.innerText = `登録完了！ID: ${newVid}\nメールを確認してください。`; 
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: "password123" });
                
                if (error) { 
                    throw error;
                } else if (data.user) {
                    const userVid = data.user.user_metadata.volunteer_id || vid;
                    msg.style.color = "green";
                    msg.innerText = "ログイン成功！";
                    setTimeout(() => {
                        window.location.href = `calendar_volunteer.html?vid=${encodeURIComponent(userVid)}`;
                    }, 800);
                }
            }
        } catch (err) {
            msg.innerText = "エラー: " + err.message;
        }
    }
</script>
</body>
</html>
