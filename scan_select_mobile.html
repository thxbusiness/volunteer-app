<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約最終確認</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .label { font-weight: bold; font-size: 0.9rem; display: block; margin-top: 15px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        .checkbox-container { margin: 20px 0; display: flex; align-items: center; background: #fff9db; padding: 15px; border-radius: 8px; border: 1px solid #fab005; }
        input[type="checkbox"] { transform: scale(1.5); margin-right: 15px; cursor: pointer; }
        
        #approve-btn { 
            width: 100%; padding: 15px; background: #3788d8; color: white; border: none; 
            border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        #approve-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
        .modal-content { background: white; width: 85%; max-width: 400px; margin: 20% auto; padding: 20px; border-radius: 12px; text-align: center; }
        .loading { display: none; margin: 20px 0; font-size: 14px; color: #666; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="card">
    <h3>✅ 予約承認</h3>
    <p id="slot-info" style="font-size: 0.9rem; color: #666;">読み込み中...</p>

    <label class="label">店舗名</label>
    <input id="restaurantName" type="text" placeholder="例：カフェ・サンプル" oninput="validate()">

    <label class="label">メールアドレス（キャンセルコード送信用）</label>
    <input id="restaurantEmail" type="email" placeholder="example@email.com" oninput="validate()">

    <div class="checkbox-container">
        <input type="checkbox" id="mealCheck" onchange="validate()">
        <label for="mealCheck" style="font-size: 0.9rem; cursor: pointer;">
            本日のまかない（食事）を1食提供することに同意します。
        </label>
    </div>

    <button id="approve-btn" disabled onclick="openConfirmModal()">承認してメールを送信</button>
</div>

<div id="confirm-modal" class="modal">
    <div class="modal-content">
        <h4>最終確認</h4>
        <p>予約を確定し、ボランティアへ通知メールを送信します。よろしいですか？</p>
        <div id="loading" class="loading">処理中...</div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="closeModal('confirm-modal')" style="flex:1; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">キャンセル</button>
            <button id="send-btn" onclick="executeApprove()" style="flex:1; padding: 10px; background: #3788d8; color: white; border: none; border-radius: 5px;">送信する</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
    const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";
    const MAKE_URL = "https://hook.us2.make.com/6h0uqu6v775267x50p56g17h892b1a1c"; // 送信先URL
    const supabaseClient = supabase.createClient(SUPABASE_URL, API_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const SLOT_ID = urlParams.get('id');
    const VOLUNTEER_ID = urlParams.get('vid');

    // 初期表示
    if (SLOT_ID) {
        document.getElementById("slot-info").innerText = `予約枠ID: ${SLOT_ID} を処理します。`;
    }

    // 3点バリデーション
    function validate() {
        const name = document.getElementById("restaurantName").value.trim();
        const email = document.getElementById("restaurantEmail").value.trim();
        const meal = document.getElementById("mealCheck").checked;
        
        // 簡易メール形式チェック
        const isEmailValid = email.includes('@') && email.includes('.');
        
        // 全て揃ったらボタンを有効化
        document.getElementById("approve-btn").disabled = !(name && email && isEmailValid && meal);
    }

    function openConfirmModal() { document.getElementById("confirm-modal").style.display = "block"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    async function executeApprove() {
        const name = document.getElementById("restaurantName").value;
        const email = document.getElementById("restaurantEmail").value;
        const sendBtn = document.getElementById("send-btn");
        const generatedPasscode = Math.floor(1000 + Math.random() * 9000); // 4桁コード

        sendBtn.disabled = true;
        sendBtn.innerText = "送信中...";
        document.getElementById("loading").style.display = "block";

        try {
            // 1. Supabaseの予約状況を更新
            const { error: dbError } = await supabaseClient
                .from('availability')
                .update({ 
                    booked: true, 
                    restaurant_name: name, 
                    restaurant_email: email, 
                    cancel_code: generatedPasscode.toString() 
                })
                .eq('id', SLOT_ID);

            if (dbError) throw dbError;

            // 2. Make.com Webhookへ通知送信
            await fetch(MAKE_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    type: "契約成立通知",
                    restaurant_name: name,
                    restaurant_email: email,
                    cancel_code: generatedPasscode,
                    volunteer_id: VOLUNTEER_ID,
                    slot_id: SLOT_ID
                })
            });

            alert("承認が完了しました！メールを送信しました。");
            // 管理カレンダーへ戻る
            window.location.href = `admin_calendar.html?vid=${VOLUNTEER_ID}`;

        } catch (e) {
            console.error(e);
            alert("エラーが発生しました。入力を確認してください。");
            sendBtn.disabled = false;
            sendBtn.innerText = "送信する";
            document.getElementById("loading").style.display = "none";
        }
    }
</script>

</body>
</html>
