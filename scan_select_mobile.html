<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約最終確認</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        #approve-btn { width: 100%; padding: 18px; background: #28a745; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; max-width: 350px; padding: 25px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h3>店舗承認フォーム</h3>
    <input id="restaurantName" type="text" placeholder="店舗名">
    <input id="restaurantEmail" type="email" placeholder="メールアドレス">
    <button id="approve-btn" onclick="showConfirm()">承認・パスコード発行</button>
</div>

<div id="confirm-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>キャンセルコード</h2>
        <div id="passcode-val" style="font-size: 2rem; font-weight: bold; margin: 20px 0;">0000</div>
        <button onclick="finalSubmit()" style="width:100%; padding:15px; background:#007bff; color:white; border:none; border-radius:10px;">送信</button>
    </div>
</div>

<script>
const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";
const MAKE_URL = "https://hook.eu1.make.com/pqs6sf0lw7z3gvgcj5up3vcoqv6j8a1z";
const params = new URLSearchParams(location.search);
const SLOT_ID = params.get("slot_id");
const VOLUNTEER_ID = params.get("vid");
const VOLUNTEER_EMAIL = params.get("v_email"); // 【修正】引き継いだメアドを保持
let generatedPasscode = "";

function showConfirm() {
    generatedPasscode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById("passcode-val").innerText = generatedPasscode;
    document.getElementById("confirm-modal").style.display = "flex";
}

async function finalSubmit() {
    const name = document.getElementById("restaurantName").value;
    const email = document.getElementById("restaurantEmail").value;
    
    try {
        await fetch(`${SUPABASE_URL}/rest/v1/availability?id=eq.${SLOT_ID}`, {
            method: "PATCH",
            headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ booked: true, restaurant_name: name, restaurant_email: email, cancel_code: generatedPasscode })
        });

        await fetch(MAKE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                type: "契約成立通知",
                restaurant_name: name,
                restaurant_email: email,
                cancel_code: generatedPasscode,
                volunteer_id: VOLUNTEER_ID,
                volunteer_email: VOLUNTEER_EMAIL // 【修正】これでMake.comに届きます
            })
        });

        alert("完了しました");
        window.location.href = `admin_calendar.html?vid=${VOLUNTEER_ID}&v_email=${encodeURIComponent(VOLUNTEER_EMAIL)}`;
    } catch (e) { alert("エラーが発生しました。"); }
}
</script>
</body>
</html>
