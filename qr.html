<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボランティアQRコード</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f4f8; }
        .container { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #qrcode { margin: 20px 0; }
        h1 { color: #333; font-size: 1.5em; }
        .vid-label { font-size: 1.2em; color: #3788d8; font-weight: bold; margin-bottom: 10px; }
        .instruction { color: #666; font-size: 0.9em; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>ボランティア受付QR</h1>
        <div id="vidDisplay" class="vid-label">ID: 読み込み中...</div>
        <div id="qrcode"></div>
        <p class="instruction">飲食店の方にこのコードを<br>スキャンしてもらってください</p>
    </div>

    <script>
        // 1. URLからボランティアID(vid)を取得
        const urlParams = new URLSearchParams(window.location.search);
        const vid = urlParams.get('vid') || '未設定';
        document.getElementById('vidDisplay').innerText = "ボランティアID: " + vid;

        // 2. このアプリの本番URLをベースに、カレンダー画面のURLを生成
        // 例: https://volunteer-app-murex.vercel.app/calendar_volunteer.html?vid=A001
        const baseUrl = window.location.origin;
        const targetUrl = `${baseUrl}/calendar_volunteer.html?vid=${vid}`;

        // 3. QRコードを生成
        new QRCode(document.getElementById("qrcode"), {
            text: targetUrl,
            width: 256,
            height: 256,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
