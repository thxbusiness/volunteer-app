<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗提示用QRコード</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f4f8; }
        .container { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #qrcode { margin: 20px 0; border: 10px solid white; display: inline-block; }
        h1 { color: #333; font-size: 1.4em; margin-bottom: 5px; }
        .vid-label { font-size: 1.1em; color: #3788d8; font-weight: bold; }
        .instruction { color: #e63946; font-weight: bold; font-size: 0.9em; margin-top: 15px; border: 1px dashed #e63946; padding: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>飲食店さま専用</h1>
        <div id="vidDisplay" class="vid-label">ID: --</div>
        <div id="qrcode"></div>
        <div class="instruction">
            店舗スタッフの方へ：<br>
            スキャンして「承認」ボタンを<br>押してください。
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vid = urlParams.get('vid') || 'A001'; // IDがない場合は仮でA001
        document.getElementById('vidDisplay').innerText = "ボランティアID: " + vid;

        // 【ここを修正！】
        // scan_select.html へ直接飛ぶURLを作成します
        const baseUrl = window.location.origin;
        const targetUrl = `${baseUrl}/scan_select.html?vid=${vid}`;

        new QRCode(document.getElementById("qrcode"), {
            text: targetUrl,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
