<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ボランティア管理システム</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        .btn { display: inline-block; padding: 15px 30px; background: #3788d8; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ボランティア登録サイト</h1>
        <p>カレンダーの確認・登録にはログインが必要です。</p>
        <a id="login-link" href="auth.html" class="btn">ログイン・新規登録画面へ</a>
    </div>

    <script>
        // URLについている ?vid=A001 などの情報を、ログインボタンのリンクに引き継ぎます
        const urlParams = new URLSearchParams(window.location.search);
        const vid = urlParams.get('vid');
        if (vid) {
            const loginLink = document.getElementById('login-link');
            loginLink.href = `auth.html?vid=${encodeURIComponent(vid)}`;
        }
    </script>
</body>
</html>
