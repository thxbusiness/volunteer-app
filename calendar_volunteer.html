<script>
const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";

let VOLUNTEER_ID = new URLSearchParams(location.search).get("vid");
let calendar;

// ページ読み込み時の処理
document.addEventListener('DOMContentLoaded', async () => {
    // 1. まずカレンダーを準備（表示はまだ）
    initCalendar();
    
    // 2. ログイン状態の確認
    try {
        const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
        });

        // 通信が成功し、ユーザーが存在する場合のみ続行
        if (userRes.ok) {
            const user = await userRes.json();
            
            // 3. DBから名前を取得
            const res = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${user.id}`, {
                headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
            });
            const data = await res.json();
            
            if (data && data.length > 0) {
                document.getElementById('user-name').innerText = data[0].nickname || "ボランティア";
                if (!VOLUNTEER_ID) VOLUNTEER_ID = data[0].volunteer_id;
                
                // 4. 全て揃ったらデータを読み込んでカレンダーを表示
                loadEvents();
            }
        } else {
            // ★ここがポイント：ログインしていないと「確定」した場合のみ飛ばす
            console.warn("ログインが確認できませんでした");
            // window.location.href = "index.html"; // 一旦コメントアウトして、飛ばないかテストするのも手です
        }
    } catch (e) {
        console.error("Auth check failed:", e);
    }
});

function initCalendar() {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        locale: 'ja',
        selectable: true,
        editable: true,
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'timeGridWeek,timeGridDay' },
        // ... その他の設定
    });
    calendar.render();
}

// （loadEvents 関数などは以前のまま）
</script>
