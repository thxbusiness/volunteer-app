<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>予約管理（管理者用）</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        :root {
            --primary-color: #3788d8;
            --booked-color: #999;
            --bg-color: #f0f2f5;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 10px; background-color: var(--bg-color); color: #333;
            overflow-x: hidden; /* 横揺れ防止 */
        }
        .container {
            max-width: 100%; margin: 0 auto; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 { text-align: center; font-size: 1.1rem; margin: 5px 0 15px; color: #1a1a1a; }

        /* --- ここが重要：カレンダーの高さを画面に合わせて固定 --- */
        .fc { 
            font-size: 10px !important; 
            height: 70vh !important; /* 画面高の70%に固定。残りの30%はヘッダーや余白用 */
        }
        
        /* 1時間あたりの縦幅 */
        .fc-timegrid-slot {
            height: 45px !important; 
        }
        
        .fc-toolbar-title { font-size: 13px !important; }
        .fc-day-past, .fc-timegrid-slot-past { background-color: #f5f5f5 !important; }
        .fc-v-event { padding: 1px 2px; border-radius: 4px; }

        /* 独自ポップアップ */
        #custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; }
        .modal-datetime { font-size: 18px; font-weight: bold; color: var(--primary-color); display: block; margin-bottom: 15px; }
        .modal-text { font-size: 14px; margin-bottom: 20px; display: block; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-confirm { background: var(--primary-color); color: white; }
        .btn-cancel { background: #eee; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>予約確認・登録</h1>
    <div id="calendar"></div>
</div>

<div id="custom-modal">
    <div class="modal-content">
        <span id="modal-datetime" class="modal-datetime"></span>
        <span class="modal-text">この枠で予約を進めますか？</span>
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModal()">戻る</button>
            <button id="modal-confirm-btn" class="btn btn-confirm">進む</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";

const urlParams = new URLSearchParams(window.location.search);
const VOLUNTEER_ID = urlParams.get("vid") || "A001";
let calendar;

document.addEventListener('DOMContentLoaded', function() {
    initCalendar();
    loadEvents();
});

function openModal(dateStr, timeStr, event) {
    document.getElementById('modal-datetime').innerText = `${dateStr} ${timeStr}`;
    document.getElementById('custom-modal').style.display = 'flex';
    document.getElementById('modal-confirm-btn').onclick = function() {
        const params = new URLSearchParams({
            vid: VOLUNTEER_ID, start: event.startStr, end: event.endStr, slot_id: event.id
        });
        window.location.href = `scan_select_mobile.html?${params.toString()}`;
    };
}

function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

function initCalendar() {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        locale: 'ja',
        allDaySlot: false,
        slotMinTime: "07:00:00",
        slotMaxTime: "23:00:00",
        scrollTime: "08:00:00", 
        // --- 修正：高さを固定値(autoではなく)に設定 ---
        height: "100%", 
        // ------------------------------------------
        stickyHeaderDates: true,
        headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
        dayHeaderFormat: { day: 'numeric', weekday: 'short', omitCommas: true },

        eventClick: async function(info) {
            const event = info.event;
            if (event.extendedProps.booked) {
                const code = prompt("キャンセルコードを入力してください:");
                if (!code) return;
                if (String(code).trim() === String(event.extendedProps.cancel_code).trim()) {
                    if (confirm("予約をキャンセルしますか？")) {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?id=eq.${event.id}`, {
                            method: "PATCH",
                            headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                            body: JSON.stringify({ booked: false, restaurant_name: null })
                        });
                        if (res.ok) { alert("予約を解除しました。"); loadEvents(); }
                    }
                } else { alert("キャンセルコードが正しくありません。"); }
                return;
            }
            if (event.start < new Date()) { alert("過去の時間は予約できません。"); return; }
            
            const dateStr = new Intl.DateTimeFormat('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' }).format(event.start);
            const timeStr = `${event.start.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}〜${event.end.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`;
            openModal(dateStr, timeStr, event);
        }
    });
    calendar.render();
}

async function loadEvents() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?volunteer_id=eq.${VOLUNTEER_ID}`, {
        headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
    });
    const data = await res.json();
    calendar.removeAllEvents();
    const now = new Date();
    data.forEach(item => {
        const start = item.start_time.split('+')[0].split('Z')[0];
        const end = item.end_time.split('+')[0].split('Z')[0];
        let bgColor = "#3788d8"; let titleText = "予約可能";
        if (item.booked) { bgColor = "#999"; titleText = `予約済: ${item.restaurant_name || ''}`; }
        else if (new Date(start) < now) { bgColor = "#bbb"; titleText = "終了"; }
        calendar.addEvent({
            id: item.id, start, end, title: titleText, backgroundColor: bgColor, borderColor: bgColor,
            extendedProps: { booked: item.booked, cancel_code: item.cancel_code }
        });
    });
}
</script>
</body>
</html>
