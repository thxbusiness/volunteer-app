<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>予約管理（管理者用）</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-color: #3788d8; --booked-color: #999; --bg-color: #f0f2f5; --danger-color: #e53e3e; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 10px; background-color: var(--bg-color); color: #333; overflow-x: hidden; }
        .container { max-width: 100%; margin: 0 auto; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; font-size: 1.1rem; margin: 5px 0 15px; color: #1a1a1a; }
        .fc { font-size: 10px !important; height: 80vh !important; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; flex: 1; font-size: 14px; }
        .btn-confirm { background: var(--primary-color); color: white; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-danger { background: var(--danger-color); color: white; }
        .cancel-input { width: 100%; padding: 12px; margin: 0 auto 20px auto; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; display: block; text-align: center; }
    </style>
</head>
<body>
<div class="container"><h1>予約登録・確認</h1><div id="calendar"></div></div>

<div id="reserve-modal" class="modal-overlay">
    <div class="modal-content">
        <span id="reserve-datetime" style="font-weight:bold; display:block; margin-bottom:15px;"></span>
        <p>この枠で予約を進めますか？</p>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-cancel" onclick="closeModal('reserve-modal')">戻る</button>
            <button id="reserve-confirm-btn" class="btn btn-confirm">進む</button>
        </div>
    </div>
</div>

<div id="cancel-modal" class="modal-overlay">
    <div class="modal-content">
        <span style="font-weight:bold; display:block; margin-bottom:15px; color: var(--danger-color);">予約キャンセル</span>
        <input type="text" id="cancel-code-input" class="cancel-input" placeholder="キャンセルコードを入力">
        <div style="display:flex; gap:10px;">
            <button class="btn btn-cancel" onclick="closeModal('cancel-modal')">閉じる</button>
            <button id="cancel-confirm-btn" class="btn btn-danger">キャンセル</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";

const urlParams = new URLSearchParams(window.location.search);
const VOLUNTEER_ID = urlParams.get("vid") || "A001";
// メールアドレスの取得と前後の空白削除
const VOLUNTEER_EMAIL = (urlParams.get("v_email") || "").trim(); 

let calendar;

document.addEventListener('DOMContentLoaded', function() { initCalendar(); loadEvents(); });

function initCalendar() {
    calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'timeGridWeek', 
        locale: 'ja', 
        allDaySlot: false,
        slotMinTime: "08:00:00",
        slotMaxTime: "22:00:00",
        eventClick: function(info) {
            const event = info.event;
            if (event.extendedProps.booked) { openCancelModal(event); return; }

            const start = event.start;
            const end = event.end;
            const dateStr = `${start.getMonth() + 1}/${start.getDate()}(${['日','月','火','水','木','金','土'][start.getDay()]})`;
            const timeStr = `${start.getHours()}:${String(start.getMinutes()).padStart(2, '0')}〜${end.getHours()}:${String(end.getMinutes()).padStart(2, '0')}`;
            const fullDisplayTime = `${dateStr} ${timeStr}`;

            document.getElementById('reserve-datetime').innerText = fullDisplayTime;
            document.getElementById('reserve-modal').style.display = 'flex';

            document.getElementById('reserve-confirm-btn').onclick = function() {
                // パラメータを安全に作成
                const queryParams = new URLSearchParams();
                queryParams.append("vid", VOLUNTEER_ID);
                queryParams.append("v_email", VOLUNTEER_EMAIL);
                queryParams.append("slot_id", event.id);
                queryParams.append("display_time", fullDisplayTime);

                window.location.href = `scan_select_mobile.html?${queryParams.toString()}`;
            };
        }
    });
    calendar.render();
}

async function loadEvents() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?volunteer_id=eq.${VOLUNTEER_ID}`, { 
        headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` } 
    });
    const data = await res.json();
    calendar.removeAllEvents();
    data.forEach(item => {
        const start = item.start_time.split('+')[0];
        const end = item.end_time.split('+')[0];
        calendar.addEvent({ 
            id: item.id, 
            start, 
            end, 
            title: item.booked ? `予約済: ${item.restaurant_name}` : "予約可能", 
            backgroundColor: item.booked ? "#999" : "#3788d8", 
            borderColor: item.booked ? "#999" : "#3788d8", 
            extendedProps: { 
                booked: item.booked, 
                cancel_code: item.cancel_code 
            } 
        });
    });
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function openCancelModal(event) {
    document.getElementById('cancel-code-input').value = "";
    document.getElementById('cancel-modal').style.display = 'flex';
    document.getElementById('cancel-confirm-btn').onclick = async function() {
        const code = document.getElementById('cancel-code-input').value;
        if (code === String(event.extendedProps.cancel_code)) {
            await fetch(`${SUPABASE_URL}/rest/v1/availability?id=eq.${event.id}`, { 
                method: "PATCH", 
                headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" }, 
                body: JSON.stringify({ booked: false, restaurant_name: null, restaurant_email: null, cancel_code: null }) 
            });
            location.reload();
        } else { 
            alert("キャンセルコードが一致しません。"); 
        }
    };
}
</script>
</body>
</html>
