<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>予約管理（管理者用）</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        :root {
            --primary-color: #3788d8;
            --booked-color: #999;
            --bg-color: #f0f2f5;
            --danger-color: #e53e3e;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 10px; background-color: var(--bg-color); color: #333;
            overflow-x: hidden;
        }
        .container {
            max-width: 100%; margin: 0 auto; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 { text-align: center; font-size: 1.1rem; margin: 5px 0 15px; color: #1a1a1a; }

        .fc { 
            font-size: 10px !important; 
            height: 80vh !important; 
        }
        .fc-timegrid-slot { height: 22.5px !important; }
        .fc-event-title { 
            font-size: 11px !important; 
            font-weight: bold !important;
            padding: 1px 2px !important;
            line-height: 1.2;
        }
        .fc-toolbar-title { font-size: 13px !important; }
        .fc-day-past, .fc-timegrid-slot-past { background-color: #f5f5f5 !important; }
        .fc-v-event { border-radius: 4px; border: none !important; }

        /* モーダル共通設定 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; }
        .modal-title { font-size: 18px; font-weight: bold; color: var(--primary-color); display: block; margin-bottom: 15px; }
        .modal-text { font-size: 14px; margin-bottom: 20px; display: block; color: #666; }
        
        .cancel-input {
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; margin-bottom: 20px;
            box-sizing: border-box; font-size: 16px; text-align: center; outline: none;
        }
        .cancel-input:focus { border-color: var(--primary-color); }

        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; flex: 1; }
        .btn-confirm { background: var(--primary-color); color: white; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-danger { background: var(--danger-color); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>予約登録・確認</h1>
    <div id="calendar"></div>
</div>

<div id="reserve-modal" class="modal-overlay">
    <div class="modal-content">
        <span id="reserve-datetime" class="modal-title"></span>
        <span class="modal-text">この枠で予約を進めますか？</span>
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModal('reserve-modal')">戻る</button>
            <button id="reserve-confirm-btn" class="btn btn-confirm">進む</button>
        </div>
    </div>
</div>

<div id="cancel-modal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-title" style="color: var(--danger-color);">予約キャンセル</span>
        <span class="modal-text">キャンセルコードを入力してください</span>
        <input type="text" id="cancel-code-input" class="cancel-input" placeholder="コードを入力">
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModal('cancel-modal')">閉じる</button>
            <button id="cancel-confirm-btn" class="btn btn-danger">次へ</button>
        </div>
    </div>
</div>

<div id="confirm-modal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-title" style="color: var(--danger-color);">最終確認</span>
        <span class="modal-text">本当にこの予約をキャンセルしますか？</span>
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModal('confirm-modal')">いいえ</button>
            <button id="final-delete-btn" class="btn btn-danger">はい、解除します</button>
        </div>
    </div>
</div>

<div id="message-modal" class="modal-overlay">
    <div class="modal-content">
        <span id="message-title" class="modal-title">通知</span>
        <span id="message-text" class="modal-text"></span>
        <div class="modal-buttons">
            <button class="btn btn-confirm" onclick="closeModal('message-modal')">OK</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";

const urlParams = new URLSearchParams(window.location.search);
const VOLUNTEER_ID = urlParams.get("vid") || "A001";
let calendar;

document.addEventListener('DOMContentLoaded', function() {
    initCalendar();
    loadEvents();
});

function showMessage(title, text) {
    document.getElementById('message-title').innerText = title;
    document.getElementById('message-text').innerText = text;
    document.getElementById('message-modal').style.display = 'flex';
}

function openReserveModal(dateStr, timeStr, event) {
    document.getElementById('reserve-datetime').innerText = `${dateStr} ${timeStr}`;
    document.getElementById('reserve-modal').style.display = 'flex';
    document.getElementById('reserve-confirm-btn').onclick = function() {
        const params = new URLSearchParams({
            vid: VOLUNTEER_ID, start: event.startStr, end: event.endStr, slot_id: event.id
        });
        window.location.href = `scan_select_mobile.html?${params.toString()}`;
    };
}

function openCancelModal(event) {
    const input = document.getElementById('cancel-code-input');
    input.value = '';
    document.getElementById('cancel-modal').style.display = 'flex';
    setTimeout(() => input.focus(), 100);
    
    document.getElementById('cancel-confirm-btn').onclick = function() {
        const code = input.value.trim();
        if (!code) return;
        
        if (String(code) === String(event.extendedProps.cancel_code).trim()) {
            closeModal('cancel-modal');
            openFinalConfirmModal(event);
        } else { 
            showMessage("エラー", "キャンセルコードが正しくありません。");
        }
    };
}

function openFinalConfirmModal(event) {
    document.getElementById('confirm-modal').style.display = 'flex';
    document.getElementById('final-delete-btn').onclick = async function() {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?id=eq.${event.id}`, {
            method: "PATCH",
            headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ booked: false, restaurant_name: null })
        });
        if (res.ok) { 
            closeModal('confirm-modal');
            showMessage("完了", "予約を解除しました。"); 
            loadEvents(); 
        } else {
            showMessage("エラー", "通信エラーが発生しました。");
        }
    };
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function initCalendar() {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        locale: 'ja',
        allDaySlot: false,
        slotMinTime: "00:00:00",
        slotMaxTime: "24:00:00",
        scrollTime: "08:00:00", 
        height: "100%", 
        stickyHeaderDates: true,
        headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
        dayHeaderFormat: { day: 'numeric', weekday: 'short', omitCommas: true },

        eventClick: function(info) {
            const event = info.event;
            if (event.extendedProps.booked) {
                openCancelModal(event);
                return;
            }
            if (event.start < new Date()) { 
                showMessage("制限", "過去の時間は予約できません。");
                return; 
            }
            
            const dateStr = new Intl.DateTimeFormat('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' }).format(event.start);
            const timeStr = `${event.start.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}〜${event.end.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`;
            openReserveModal(dateStr, timeStr, event);
        }
    });
    calendar.render();
}

async function loadEvents() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?volunteer_id=eq.${VOLUNTEER_ID}`, {
        headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
    });
    const data = await res.json();
    calendar.removeAllEvents();
    const now = new Date();
    data.forEach(item => {
        const start = item.start_time.split('+')[0].split('Z')[0];
        const end = item.end_time.split('+')[0].split('Z')[0];
        let bgColor = "#3788d8"; let titleText = "予約可能";
        if (item.booked) { bgColor = "#999"; titleText = `予約済: ${item.restaurant_name || ''}`; }
        else if (new Date(start) < now) { bgColor = "#bbb"; titleText = "終了"; }
        calendar.addEvent({
            id: item.id, start, end, title: titleText, backgroundColor: bgColor, borderColor: bgColor,
            extendedProps: { booked: item.booked, cancel_code: item.cancel_code }
        });
    });
}
</script>
</body>
</html>
