<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>予約管理（管理者用）</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-color: #3788d8; --bg-color: #f0f2f5; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background-color: var(--bg-color); }
        .container { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .fc { font-size: 10px !important; height: 80vh !important; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-confirm { background: var(--primary-color); color: white; }
        .btn-cancel { background: #eee; color: #333; }
    </style>
</head>
<body>
<div class="container"><h1>予約登録</h1><div id="calendar"></div></div>
<div id="reserve-modal" class="modal-overlay">
    <div class="modal-content">
        <span id="reserve-datetime" style="font-weight:bold; display:block; margin-bottom:15px;"></span>
        <p>この枠で予約を進めますか？</p>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-cancel" onclick="closeModal()">戻る</button>

const urlParams = new URLSearchParams(window.location.search);
const VOLUNTEER_ID = urlParams.get("vid") || "A001";
const VOLUNTEER_EMAIL = urlParams.get("v_email") || ""; // QRから受け取る

document.addEventListener('DOMContentLoaded', () => { initCalendar(); loadEvents(); });

function initCalendar() {
    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'timeGridWeek', locale: 'ja', allDaySlot: false,
        eventClick: function(info) {
            if (info.event.extendedProps.booked) return;
            document.getElementById('reserve-datetime').innerText = info.event.start.toLocaleString();
            document.getElementById('reserve-modal').style.display = 'flex';
            document.getElementById('reserve-confirm-btn').onclick = () => {
                const p = new URLSearchParams({ vid: VOLUNTEER_ID, v_email: VOLUNTEER_EMAIL, slot_id: info.event.id, start: info.event.startStr, end: info.event.endStr });
                window.location.href = `scan_select_mobile.html?${p.toString()}`;
            };
        }
    });
    calendar.render();
}

async function loadEvents() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?volunteer_id=eq.${VOLUNTEER_ID}`, { headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` } });
    const data = await res.json();

}
function closeModal() { document.getElementById('reserve-modal').style.display = 'none'; }
</script>
