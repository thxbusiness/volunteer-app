<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>予約管理（管理者用）</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        :root {
            --primary-color: #3788d8;
            --booked-color: #999;
            --bg-color: #f0f2f5;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; 
            padding: 10px;
            background-color: var(--bg-color); 
            color: #333;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 { 
            text-align: center; 
            font-size: 1.2rem;
            margin: 10px 0 20px;
            color: #1a1a1a;
        }

        /* カレンダー全体のフォントサイズを10pxに設定 */
        .fc { 
            font-size: 10px !important; 
        }
        
        /* ヘッダーのタイトル（年月）は読みやすさのため少し大きめに維持 */
        .fc-toolbar-title { 
            font-size: 14px !important; 
        }
        
        /* 過去のセルのグレーアウト */
        .fc-day-past, .fc-timegrid-slot-past { 
            background-color: #f5f5f5 !important; 
        }

        /* 予定ブロックの余白 */
        .fc-v-event { padding: 1px 2px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>予約確認・登録</h1>
    <div id="calendar"></div>
</div>

<script>
const SUPABASE_URL = "https://smoqrovdeegbacvqmaoe.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtb3Fyb3ZkZWVnYmFjdnFtYW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzY4MzQsImV4cCI6MjA5MDcxMjgzNH0.66uW0V_IolQiW0Bi1knO5wX5oOBdOfPEcxLdR3ubHjs";

const urlParams = new URLSearchParams(window.location.search);
const VOLUNTEER_ID = urlParams.get("vid") || "A001";
let calendar;

document.addEventListener('DOMContentLoaded', function() {
    initCalendar();
    loadEvents();
});

function initCalendar() {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        locale: 'ja',
        allDaySlot: false,
        slotMinTime: "08:00:00",
        slotMaxTime: "22:00:00",
        height: "auto",
        stickyHeaderDates: true,
        headerToolbar: { 
            left: 'prev,next today', 
            center: 'title', 
            right: '' 
        },
        
        // 日付ヘッダーの表示形式をカスタマイズ（月を除去）
        dayHeaderFormat: { day: 'numeric', weekday: 'short', omitCommas: true },

        eventClick: async function(info) {
            const event = info.event;
            const isBooked = event.extendedProps.booked;
            const now = new Date();

            if (isBooked) {
                const code = prompt("キャンセルコードを入力してください:");
                if (!code) return;

                const savedCode = event.extendedProps.cancel_code;
                if (String(code).trim() === String(savedCode).trim()) {
                    if (confirm("予約をキャンセルして枠を空けますか？")) {
                        const updateData = { booked: false, restaurant_name: null };
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?id=eq.${event.id}`, {
                            method: "PATCH",
                            headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                            body: JSON.stringify(updateData)
                        });
                        if (res.ok) { alert("予約を解除しました。"); loadEvents(); }
                    }
                } else {
                    alert("キャンセルコードが正しくありません。");
                }
                return;
            }

            if (event.start < now) {
                alert("過去の時間は予約できません。");
                return;
            }
            
            const startTimeStr = event.start.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            if (confirm(`${startTimeStr} の枠で予約を進めますか？`)) {
                const params = new URLSearchParams({
                    vid: VOLUNTEER_ID,
                    start: event.startStr,
                    end: event.endStr,
                    slot_id: event.id
                });
                window.location.href = `scan_select_mobile.html?${params.toString()}`;
            }
        }
    });
    calendar.render();
}

async function loadEvents() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?volunteer_id=eq.${VOLUNTEER_ID}`, {
        headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
    });
    const data = await res.json();
    calendar.removeAllEvents();
    const now = new Date();

    data.forEach(item => {
        const startTimeRaw = item.start_time.split('+')[0].split('Z')[0];
        const endTimeRaw = item.end_time.split('+')[0].split('Z')[0];
        const eventStart = new Date(startTimeRaw);
        
        let bgColor = "#3788d8"; 
        let titleText = "予約可能";

        if (item.booked) {
            bgColor = "#999";
            titleText = `予約済: ${item.restaurant_name || ''}`;
        } else if (eventStart < now) {
            bgColor = "#bbb";
            titleText = "終了";
        }

        calendar.addEvent({
            id: item.id,
            start: startTimeRaw,
            end: endTimeRaw,
            title: titleText,
            backgroundColor: bgColor,
            borderColor: bgColor,
            extendedProps: {
                booked: item.booked,
                cancel_code: item.cancel_code 
            }
        });
    });
}
</script>
</body>
</html>
